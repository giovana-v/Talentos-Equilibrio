<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Consulte, filtre e gerencie os perfis dos colaboradores da equipe.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#330000">
  <title>Colaboradores | Talentos em Equilíbrio</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/pages/dashboard.css">
  <link rel="stylesheet" href="../css/pages/colaboradores.css">
  <script src="../js/utils/auth.js"></script>
</head>
<body class="dashboard-page">
  <a class="skip-link" href="#main-content">Pular para o conteúdo principal</a>
  <div class="dashboard-shell">
    <aside class="sidebar" aria-label="Menu principal" data-sidebar data-active="colaboradores.html"></aside>

    <main class="dashboard-main collaborators-main" id="main-content" tabindex="-1">
      <header class="collaborators-header">
        <div>
          <p class="eyebrow">Equipe</p>
          <h1>Colaboradores</h1>
        </div>
        <div class="collaborators-toolbar">
          <label class="search-field">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
            <input type="search" id="search-colaboradores" placeholder="Buscar por nome, setor ou cargo..." autocomplete="off">
          </label>
          <button class="add-collaborator-button" type="button" id="open-collaborator-form">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            <span>Novo colaborador</span>
          </button>
        </div>
      </header>

      <p class="auth-notice" data-auth-notice role="status" hidden></p>

      <section class="collaborators-panel" aria-labelledby="collaborators-heading">
        <h2 class="visually-hidden" id="collaborators-heading">Lista de colaboradores</h2>
        <fieldset class="filter-row">
          <legend class="visually-hidden">Filtros de colaboradores</legend>
          <label class="filter-control">
            <span class="visually-hidden">Filtrar por setor</span>
            <select id="filter-sector"><option value="">Todos os setores</option></select>
          </label>
          <label class="filter-control">
            <span class="visually-hidden">Filtrar por cargo</span>
            <select id="filter-role"><option value="">Todos os cargos</option></select>
          </label>
          <label class="filter-control">
            <span class="visually-hidden">Filtrar por gênero</span>
            <select id="filter-gender">
              <option value="">Todos os gêneros</option>
              <option value="Feminino">Feminino</option>
              <option value="Masculino">Masculino</option>
              <option value="Outro">Outro</option>
            </select>
          </label>
        </fieldset>

        <div class="table-scroll">
          <table class="collaborators-table">
            <caption class="visually-hidden">Colaboradores cadastrados com gênero, setor, cargo atual e tempo de casa</caption>
            <thead>
              <tr>
                <th scope="col">Nome</th>
                <th scope="col">Gênero</th>
                <th scope="col">Setor</th>
                <th scope="col">Cargo atual</th>
                <th scope="col">Tempo de casa</th>
                <th scope="col"><span class="visually-hidden">Ações</span></th>
              </tr>
            </thead>
            <tbody id="collaborators-list"></tbody>
          </table>
        </div>
        <p class="table-count" id="collaborators-count" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <dialog class="collaborator-dialog" id="collaborator-dialog" aria-labelledby="collaborator-dialog-title">
    <form id="collaborator-form" method="dialog">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">Cadastro</p>
          <h2 id="collaborator-dialog-title">Novo colaborador</h2>
        </div>
        <button class="dialog-close" type="button" id="close-collaborator-form" aria-label="Fechar">×</button>
      </div>
      <label>Nome completo<input name="name" type="text" required maxlength="80" placeholder="Ex.: Joana Silva"></label>
      <div class="dialog-fields-row">
        <label>Gênero<select name="gender" required><option value="">Selecione</option><option>Feminino</option><option>Masculino</option><option>Outro</option></select></label>
        <label>Tempo de casa (anos)<input name="tenure" type="number" required min="0" max="60" step="1" value="0"></label>
      </div>
      <label>Setor<input name="sector" type="text" required maxlength="60" placeholder="Ex.: Tecnologia" list="sector-options"></label>
      <datalist id="sector-options"></datalist>
      <div class="dialog-fields-row">
        <label>Cargo atual (plano de carreira)<select name="cargoId" required><option value="">Selecione</option></select></label>
        <label>Salário (R$)<input name="salary" type="number" min="0" step="50" placeholder="Em branco = piso do cargo"></label>
      </div>
      <p class="dialog-feedback" id="collaborator-feedback" role="alert" hidden></p>
      <div class="dialog-actions">
        <button class="cancel-button" type="button" id="cancel-collaborator-form">Cancelar</button>
        <button class="add-collaborator-button" type="submit">Salvar colaborador</button>
      </div>
    </form>
  </dialog>

  <script src="../js/utils/storage.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/utils/plano.js"></script>
  <script src="../js/utils/dados.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/pages/colaboradores.js"></script>
</body>
</html>
